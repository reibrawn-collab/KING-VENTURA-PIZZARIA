<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KING VENTURA PIZZARIA — Sistema Operacional</title>
  <style>
    /* Paleta Grêmio: azul, preto e branco. Escuro (padrao) ou claro. */
    :root,
    body[data-tema="escuro"] {
      --bg: #05080f;
      --surface: #0b1526;
      --surface-2: #132241;
      --border: #1e3560;
      --text: #ffffff;
      --muted: #9fb4d6;
      --gold: #4a90e2;
      --terracotta: #1b4f9c;
      --danger: #cf4638;
      --azul-claro: #7fb8f5;
      --placeholder: #6b86ad;
      --sombra: rgba(0, 0, 0, 0.5);
    }

    body[data-tema="claro"] {
      --bg: #eef3fb;
      --surface: #ffffff;
      --surface-2: #e3ecf9;
      --border: #b9cdea;
      --text: #08203f;
      --muted: #4a6a94;
      --gold: #1b4f9c;
      --terracotta: #1b4f9c;
      --danger: #b8302a;
      --azul-claro: #4a90e2;
      --placeholder: #8ba3c4;
      --sombra: rgba(11, 21, 38, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.45;
    }

    ::selection {
      background: var(--gold);
      color: #ffffff;
    }

    body[data-tema="claro"] .card,
    body[data-tema="claro"] .brand-header,
    body[data-tema="claro"] .item,
    body[data-tema="claro"] .list-card {
      box-shadow: 0 1px 3px var(--sombra);
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--gold);
      outline-offset: 1px;
    }

    .app-container {
      max-width: 960px;
      margin: 0 auto;
    }

    .brand-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .brand-logo {
      display: block;
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .brand-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--gold);
    }

    .badge-version {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    .nav-tab {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.15s ease;
    }

    .nav-tab:hover {
      border-color: var(--gold);
      color: var(--text);
    }

    .nav-tab.active {
      background: var(--terracotta);
      color: #ffffff;
      border-color: var(--gold);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: var(--gold);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
      margin-top: 8px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    input::placeholder, textarea::placeholder {
      color: var(--placeholder);
    }

    select option {
      background: var(--surface-2);
      color: var(--text);
    }

    button {
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.gold {
      background: var(--terracotta);
      color: #ffffff;
    }

    button.danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .item, .list-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .list-card > div:first-child {
      min-width: 0;
    }

    .summary-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gold);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 6px;
    }

    /* Continua com os estilos conforme seu código original */
  </style>
</head>
<body>
  <div class="app-container">
    <header class="brand-header">
      <img src="logo01.jpeg" alt="King Ventura Pizzaria" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-top">
        <div>
          <h1 class="brand-title">KING VENTURA PIZZARIA</h1>
          <p style="color: var(--muted); font-size: 0.88rem;">Sistema Operacional • WhatsApp: 5567991476156</p>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button id="btnTema" class="secondary" type="button" style="padding: 6px 12px;">🌙 Escuro</button>
          <span class="badge-version">V7.2 REBUILD</span>
        </div>
      </div>
    </header>
    <nav class="nav-tabs" aria-label="Navegação do sistema">
      <button class="nav-tab active" data-tab="pedido">🍕 Pedido</button>
      <button class="nav-tab" data-tab="sabores">📋 Sabores & Preços</button>
      <button class="nav-tab" data-tab="clientes">👤 Clientes</button>
      <button class="nav-tab" data-tab="historico">📊 Histórico & Caixa</button>
      <button class="nav-tab" data-tab="rotas">🛵 Rotas do Entregador</button>
      <button class="nav-tab" data-tab="relatorios">💾 Relatórios & Backup</button>
    </nav>

    <!-- Conteúdo aba pedido, sabores, clientes etc conforme seu original -->

    <!-- CUPOM TÉRMICO COMPACTO (SOMENTE IMPRESSÃO) -->
    <div id="cupomTermico" aria-hidden="true"></div>
  </div>

<script>
  const NUMERO_WHATSAPP = "5567991476156";
  // ... todas as variáveis e constantes do seu código original não alteradas aqui ...

  // Função para adicionar item no carrinho corrigida (evitando duplicação)
  function adicionarItem(item) {
    pedidoAtual.itens.push(item);
    atualizarCarrinho();
  }

  // Função para remover item do carrinho
  function removerItem(indice) {
    pedidoAtual.itens.splice(indice, 1);
    atualizarCarrinho();
  }

  // Atualiza o carrinho na interface
  function atualizarCarrinho() {
    const carrinho = document.getElementById("carrinho");
    if (!carrinho) return;

    let html = "";
    pedidoAtual.itens.forEach((item, index) => {
      html += `
        <div class="item">
          <b>${item.descricao}</b><br />
          ${item.ingredientes ? `<span style="color: var(--muted); font-size: 0.85rem;">${item.ingredientes}</span><br />` : ""}
          ${item.observacao ? `<span style="color: var(--gold); font-size: 0.85rem;">Obs: ${item.observacao}</span><br />` : ""}
          <div style="margin-top: 6px; display: flex; justify-content: space-between; align-items: center;">
            <strong>Valor: R$ ${Number(item.valor).toFixed(2)}</strong>
            <button class="danger" onclick="removerItem(${index})" type="button">Excluir</button>
          </div>
        </div>
      `;
    });

    carrinho.innerHTML = html || '<p style="color: var(--muted);">Nenhum item adicionado ainda.</p>';
    atualizarTotal();
  }

  // Atualiza o total do pedido
  function atualizarTotal() {
    let subtotal = 0;
    pedidoAtual.itens.forEach((item) => {
      subtotal += Number(item.valor) || 0;
    });

    const total = subtotal + taxaEntrega;
    pedidoAtual.taxaEntrega = taxaEntrega;
    pedidoAtual.total = total;

    document.getElementById("taxaEntrega").innerText = taxaEntrega.toFixed(2);
    document.getElementById("totalPedido").innerText = total.toFixed(2);
  }

  // Sincroniza os dados do cliente ao pedido atual
  function sincronizarDadosClientePedido() {
    pedidoAtual.cliente = document.getElementById("nome").value.trim();
    pedidoAtual.telefone = document.getElementById("telefone").value.trim();
    pedidoAtual.cep = document.getElementById("cep").value.trim();
    pedidoAtual.endereco = document.getElementById("endereco").value.trim();
    pedidoAtual.numeroCasa = document.getElementById("numero").value.trim();
    pedidoAtual.observacao = document.getElementById("observacao").value.trim();
    pedidoAtual.taxaEntrega = taxaEntrega;
  }

  // Monta texto de pedido personalizado para impressão e Whats
  function montarTextoPedido(pedido) {
    let t = "KING VENTURA PIZZARIA\n\n";
    t += "Pedido: " + (pedido.numero || document.getElementById("numeroPedido").innerText) + "\n";
    t += "Status: " + normalizarStatusPedido(pedido.status || pedidoAtual.status || "Gerado") + "\n";
    t += "Cliente: " + (pedido.cliente || "") + "\n";
    t += "Telefone: " + (pedido.telefone || "") + "\n";
    t += "CEP: " + (pedido.cep || "") + "\n";
    t += "Endereço: " + (pedido.endereco || "") + "\n";
    t += "Número: " + (pedido.numeroCasa || "") + "\n";
    t += "Observação: " + (pedido.observacao || "") + "\n";
    t += "Taxa de Entrega: R$ " + Number(pedido.taxaEntrega || 0).toFixed(2) + "\n\n";
    t += "ITENS:\n[KV-ITENS]\n";

    (pedido.itens || []).forEach(function (item) {
      t += item.descricao + " - R$ " + Number(item.valor).toFixed(2) + "\n";
      if (item.adicionais && item.adicionais.length) {
        t += "Adicionais: " + item.adicionais.join(", ") + "\n";
      }
      if (item.observacao) {
        t += "Obs: " + item.observacao + "\n";
      }
      t += "\n";
    });

    t += "\nTOTAL: R$ " + Number(pedido.total || 0).toFixed(2);
    return t;
  }

  // Função para imprimir cupom térmico
  function imprimirCupomTermico() {
    sincronizarDadosClientePedido();

    const texto = montarTextoPedido(pedidoAtual);

    const linhas = texto.split("\n").map(function (linha) {
      if (linha.trim() === "") return '<div class="cupom-espaco"></div>';
      if (linha.indexOf("[KV-ITENS]") !== -1) return '<div class="cupom-linha"></div>';
      const destaque = linha.indexOf("KING VENTURA") === 0 || linha.indexOf("TOTAL:") === 0;
      return '<div class="cupom-txt' + (destaque ? " cupom-total" : "") + '">' + linha + '</div>';
    }).join("");

    document.getElementById("cupomTermico").innerHTML = linhas;

    setTimeout(function () {
      window.print();
    }, 350);
  }

  // Evento para adicionar pizza evitando duplicação
  document.getElementById("btnAdicionarPizza").addEventListener("click", function () {
    if (this.disabled) return;          
    this.disabled = true;
    const botao = this;
    setTimeout(function () { botao.disabled = false; }, 400);

    const tamanho = document.getElementById("tamanho").value;
    const tipo = document.getElementById("tipoPizza").value;
    const sabor1 = document.getElementById("sabor1").value;
    const sabor2 = document.getElementById("sabor2").value;

    if (!sabor1 || !SABORES[sabor1]) {
      alert("Selecione o Sabor 1.");
      return;
    }

    let descricao = "";
    let valor = 0;
    let ingredientes = "";

    if (tamanho === "brotinho") {
      descricao = "Brotinho 25cm - " + sabor1;
      valor = Number(SABORES[sabor1].brotinho);
      ingredientes = (SABORES[sabor1].ingredientes || []).join(", ");
    } else if (tipo === "meio") {
      if (!sabor2 || !SABORES[sabor2]) {
        alert("Selecione o Sabor 2 para pizza Meio a Meio.");
        return;
      }
      descricao = "Grande 35cm Meio a Meio - " + sabor1 + " / " + sabor2;
      valor = Math.max(Number(SABORES[sabor1].grande), Number(SABORES[sabor2].grande));
      ingredientes =
        "50% " + sabor1 + ": " + (SABORES[sabor1].ingredientes || []).join(", ") +
        " | 50% " + sabor2 + ": " + (SABORES[sabor2].ingredientes || []).join(", ");
    } else {
      descricao = "Grande 35cm - " + sabor1;
      valor = Number(SABORES[sabor1].grande);
      ingredientes = (SABORES[sabor1].ingredientes || []).join(", ");
    }

    const adicionalEl = document.getElementById("adicional");
    const valorAdicional = Number(adicionalEl.value) || 0;
    const nomeAdicional = adicionalEl.options[adicionalEl.selectedIndex].text;
    const obsPizza = document.getElementById("obsPizza").value.trim();

    adicionarItem({
      descricao: valorAdicional > 0 ? descricao + " + " + nomeAdicional : descricao,
      ingredientes: ingredientes,
      observacao: obsPizza,
      valor: valor + valorAdicional
    });
  });

  // Evento para adicionar bebida evitando duplicação
  document.getElementById("btnAdicionarBebida").addEventListener("click", function () {
    if (this.disabled) return;          
    this.disabled = true;
    const botaoBebida = this;
    setTimeout(function () { botaoBebida.disabled = false; }, 400);

    const sel = document.getElementById("bebida");
    if (!sel.value) {
      alert("Selecione uma bebida.");
      return;
    }
    const descricao = sel.options[sel.selectedIndex].text.split(" - R$ ")[0];
    const valor = Number(sel.value);
    if (!valor || isNaN(valor)) {
      alert("Selecione uma bebida válida.");
      return;
    }
    adicionarItem({
      descricao: descricao,
      ingredientes: "",
      observacao: "",
      valor: valor
    });
    sel.value = "";
  });

  // Resto do seu código permanece inalterado e completo...

  // Inicialização do sistema e carregamento dos dados como no seu arquivo original
  carregarSaboresStorage();
  carregarHistorico();
  carregarClientes();
  inicializarPedido();
  carregarSabores();
  renderizarListaSabores();
  renderizarClientes();
  renderizarHistorico();
  popularDatalistRuas();
  ligarCamposEndereco();
  atualizarStatusChaveRota();
  aplicarTema(localStorage.getItem(TEMA_LOCAL) || "escuro");

</script>
</body>
</html>
