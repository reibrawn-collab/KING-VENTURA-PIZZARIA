<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
KING VENTURA PIZZARIA
</title>

<link rel="stylesheet"
href="css/style.css">

<script src="js/sabores.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/historico.js"></script>
<script src="js/whatsapp.js"></script>

</head>

<body>

<div class="container">

<h1>
KING VENTURA PIZZARIA
</h1>

<div class="card">

<h2>
Cliente
</h2>

<input
id="nome"
placeholder="Nome do Cliente">

<input
id="telefone"
placeholder="Telefone">

<input
id="endereco"
placeholder="Endereço">

<textarea
id="observacao"
placeholder="Observação">
</textarea>

</div>
<div class="card">

<h2>
Pedido
</h2>

<label>
Tamanho
</label>

<select id="tamanho">

<option value="brotinho">
Brotinho 25cm
</option>

<option value="grande">
Grande 35cm
</option>

</select>

<label>
Tipo
</label>

<select id="tipoPizza">

<option value="inteira">
Inteira
</option>

<option value="meio">
Meio a Meio
</option>

</select>

<label>
Sabor 1
</label>

<select id="sabor1">
</select>

<label id="labelSabor2">
Sabor 2
</label>

<select id="sabor2">
</select>

<div id="ingredientes">
</div>

<button id="btnAdicionarPizza">

Adicionar Pizza

</button>

</div>

<div class="card">

<h2>
Bebidas
</h2>

<select id="bebida">

<option value="16">
Coca-Cola 2 Litros - R$ 16,00
</option>

<option value="10">
Guaraná Antarctica 1 Litro - R$ 10,00
</option>

<option value="6">
Coca-Cola Lata 310ml - R$ 6,00
</option>

</select>

<button id="btnAdicionarBebida">

Adicionar Bebida

</button>

</div>

<div class="card">

<h2>
Carrinho
</h2>

<div id="carrinho">
</div>

<h3>

Total:

R$ <span id="totalPedido">0,00</span>

</h3>

<button id="btnWhatsApp">

Enviar WhatsApp

</button>

<button onclick="window.print()">

Imprimir Pedido

</button>

</div>

</div>
<script>

console.log(
    "KING VENTURA INICIADO"
);

document
.getElementById(
    "labelSabor2"
)
.style.display = "none";

document
.getElementById(
    "sabor2"
)
.style.display = "none";

</script>
</body>
</html>
