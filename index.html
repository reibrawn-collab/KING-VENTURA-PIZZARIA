<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KING VENTURA PIZZARIA — Sistema Operacional</title>
  <style>
    :root {
      --bg: #120d0a;
      --surface: #1d1510;
      --surface-2: #271c16;
      --border: #3d2c22;
      --text: #f7efe8;
      --muted: #c2aea0;
      --gold: #e09f3e;
      --terracotta: #c84b31;
      --green: #2ea043;
      --amber: #d29922;
      --danger: #cf4638;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.45;
    }

    .app-container {
      max-width: 960px;
      margin: 0 auto;
    }

    .brand-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .brand-logo {
      display: block;
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .brand-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--gold);
    }

    .badge-version {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .nav-tab {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.15s ease;
    }

    .nav-tab:hover {
      border-color: var(--gold);
      color: var(--text);
    }

    .nav-tab.active {
      background: var(--gold);
      color: #160f0a;
      border-color: var(--gold);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: var(--gold);
    }

    .card h3 {
      font-size: 1rem;
      margin: 12px 0 8px;
      color: var(--text);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
      margin-top: 8px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    button {
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.gold {
      background: var(--gold);
      color: #160f0a;
    }

    button.danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .item, .list-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .summary-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gold);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 6px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .kpi-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .kpi-label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .kpi-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold);
      margin-top: 4px;
    }

    .status-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(210, 153, 34, 0.18);
      color: var(--amber);
    }

    .ingredients-preview {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .status-pill.status-feito {
      background: rgba(210, 153, 34, 0.2);
      color: #f0b429;
      border: 1px solid rgba(240, 180, 41, 0.45);
    }
    .status-pill.status-producao {
      background: rgba(224, 159, 62, 0.22);
      color: #ff9f1c;
      border: 1px solid rgba(255, 159, 28, 0.5);
    }
    .status-pill.status-entrega {
      background: rgba(56, 139, 253, 0.2);
      color: #58a6ff;
      border: 1px solid rgba(88, 166, 255, 0.45);
    }
    .status-pill.status-finalizado {
      background: rgba(46, 160, 67, 0.22);
      color: #3fb950;
      border: 1px solid rgba(63, 185, 80, 0.5);
    }
    .status-stepper {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .status-btn {
      padding: 6px 10px;
      font-size: 0.78rem;
      border-radius: 7px;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 700;
    }
    .status-btn.active-feito {
      background: #d29922;
      color: #160f0a;
      border-color: #d29922;
    }
    .status-btn.active-producao {
      background: #e09f3e;
      color: #160f0a;
      border-color: #e09f3e;
    }
    .status-btn.active-entrega {
      background: #2f81f7;
      color: #fff;
      border-color: #2f81f7;
    }
    .status-btn.active-finalizado {
      background: #2ea043;
      color: #fff;
      border-color: #2ea043;
    }

    #cupomTermico {
      display: none;
    }

    @media print {
      @page {
        margin: 0 !important;
        size: 58mm auto;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 58mm !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        background: #ffffff !important;
      }
      body > *:not(#cupomTermico) {
        display: none !important;
      }
      #cupomTermico {
        display: block !important;
        position: static !important;
        width: 52mm !important;
        max-width: 52mm !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        font-family: "Courier New", Courier, monospace !important;
        font-size: 12px !important;
        font-weight: 900 !important;
        line-height: 1.15 !important;
        color: #000000 !important;
        background: #ffffff !important;
        padding: 1mm 0 1mm 1mm !important;
        margin: 0 !important;
      }
      #cupomTermico, #cupomTermico * {
        font-weight: 900 !important;
        color: #000000 !important;
        background: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .cupom-linha {
        border-top: 1px dashed #000000 !important;
        margin: 3px 0 !important;
        height: 0 !important;
      }
      .cupom-item {
        margin-bottom: 3px !important;
      }
    }
  </style>
</head>

    function popularDatalistRuas() {
      const dl = document.getElementById("listaRuasCG");
      if (!dl) return;
      const mapa = new Map();

      RUAS_REFERENCIA_CG.forEach((r) => {
        mapa.set(`${r.rua} - ${r.bairro}`.toLowerCase(), r);
      });

      (clientesBase || []).forEach((c) => {
        if (c.endereco) {
          mapa.set(String(c.endereco).toLowerCase(), {
            rua: c.endereco,
            bairro: "",
            cep: c.cep || ""
          });
        }
      });

      dl.innerHTML = "";
      mapa.forEach((item) => {
        const opt = document.createElement("option");
        opt.value = item.bairro ? `${item.rua} - ${item.bairro}` : item.rua;
        dl.appendChild(opt);
      });
    }

    async function buscarCEP() {
      const cep = document.getElementById("cep").value.replace(/\D/g, "");
      if (cep.length !== 8) return;

      try {
        const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const dados = await resposta.json();
        if (!dados.erro) {
          const log = dados.logradouro || "";
          const bai = dados.bairro || "";
          document.getElementById("endereco").value = bai ? `${log} - ${bai}` : log;
        }
      } catch (erro) {
        console.log("Erro CEP", erro);
      }
    }

    async function buscarCEPPorRua() {
      const campoEnd = document.getElementById("endereco");
      const campoCep = document.getElementById("cep");
      const texto = (campoEnd.value || "").trim();
      if (texto.length < 4) return;

      const ruaLimpa = texto.split(" - ")[0].trim();
      const matchLocal = RUAS_REFERENCIA_CG.find(
        (r) =>
          `${r.rua} - ${r.bairro}`.toLowerCase() === texto.toLowerCase() ||
          r.rua.toLowerCase() === ruaLimpa.toLowerCase()
      );

      if (matchLocal && matchLocal.cep) {
        campoCep.value = matchLocal.cep;
        if (!texto.includes(" - ") && matchLocal.bairro) {
          campoEnd.value = `${matchLocal.rua} - ${matchLocal.bairro}`;
        }
        calcularTaxaEntrega();
        return;
      }

      const cliMatch = (clientesBase || []).find(
        (c) => (c.endereco || "").toLowerCase().includes(ruaLimpa.toLowerCase()) && c.cep
      );
      if (cliMatch) {
        campoCep.value = cliMatch.cep;
        calcularTaxaEntrega();
        return;
      }

      if (ruaLimpa.length >= 5) {
        try {
          const url = `https://viacep.com.br/ws/MS/Campo%20Grande/${encodeURIComponent(ruaLimpa)}/json/`;
          const resp = await fetch(url);
          const lista = await resp.json();
          if (Array.isArray(lista) && lista.length > 0 && lista[0].cep) {
            campoCep.value = lista[0].cep;
            const bai = lista[0].bairro || "";
            const log = lista[0].logradouro || ruaLimpa;
            campoEnd.value = bai ? `${log} - ${bai}` : log;
            calcularTaxaEntrega();
          }
        } catch (err) {
          console.log("Erro busca CEP por rua", err);
        }
      }
    }

    function imprimirCupomTermico() {
      sincronizarDadosClientePedido();
      const numeroPed = document.getElementById("numeroPedido").innerText || "KV";
      const dataPed = document.getElementById("dataPedido").innerText || new Date().toLocaleString("pt-BR");

      const itensArr = Array.isArray(pedidoAtual.itens) ? pedidoAtual.itens : [];
      const itensHtml = itensArr
        .map((item) => {
          const desc = String(item.descricao || "ITEM");
          const val = Number(item.valor || 0).toFixed(2);
          const obs = item.observacao ? `<div style="font-size:11px;margin-top:1px;">OBS: ${String(item.observacao)}</div>` : "";
          return `
            <div class="cupom-item">
              <div style="font-size:12px;">${desc} - R$ ${val}</div>
              ${obs}
            </div>
          `;
        })
        .join("");

      const cupomEl = document.getElementById("cupomTermico");
      cupomEl.innerHTML = `
        <div style="text-align:center;font-size:13px;">KING VENTURA PIZZARIA</div>
        <div style="font-size:11px;">PED: ${numeroPed} | ${dataPed}</div>
        <div class="cupom-linha"></div>
        <div style="font-size:11px;">CLI: ${pedidoAtual.cliente || "-"}</div>
        <div style="font-size:11px;">FONE: ${pedidoAtual.telefone || "-"}</div>
        <div style="font-size:11px;">END: ${pedidoAtual.endereco || "-"}, ${pedidoAtual.numeroCasa || "-"}</div>
        <div style="font-size:11px;">CEP: ${pedidoAtual.cep || "-"}</div>
        ${pedidoAtual.observacao ? `<div style="font-size:11px;">OBS: ${pedidoAtual.observacao}</div>` : ""}
        <div class="cupom-linha"></div>
        ${itensHtml || '<div style="font-size:12px;">SEM ITENS NO CARRINHO</div>'}
        <div class="cupom-linha"></div>
        <div style="font-size:11px;">TAXA ENTREGA: R$ ${Number(pedidoAtual.taxaEntrega || 0).toFixed(2)}</div>
        <div style="font-size:13px;margin-top:2px;">TOTAL: R$ ${Number(pedidoAtual.total || 0).toFixed(2)}</div>
        <div class="cupom-linha"></div>
        <div style="text-align:center;font-size:11px;margin-top:2px;">OBRIGADO PELA PREFERENCIA!</div>
      `;

      requestAnimationFrame(() => {
        setTimeout(() => {
          window.print();
        }, 60);
      });
    }

    function sincronizarDadosClientePedido() {
      pedidoAtual.cliente = document.getElementById("nome").value.trim();
      pedidoAtual.telefone = document.getElementById("telefone").value.trim();
      pedidoAtual.cep = document.getElementById("cep").value.trim();
      pedidoAtual.endereco = document.getElementById("endereco").value.trim();
      pedidoAtual.numeroCasa = document.getElementById("numero").value.trim();
      pedidoAtual.observacao = document.getElementById("observacao").value.trim();
      pedidoAtual.taxaEntrega = taxaEntrega;
    }

    function enviarWhatsApp(pedido) {
      let mensagem = "KING VENTURA PIZZARIA\n\n";
      mensagem += "Pedido: " + (pedido.numero || document.getElementById("numeroPedido").innerText) + "\n";
      mensagem += "Status: " + normalizarStatusPedido(pedido.status || pedidoAtual.status || "Gerado") + "\n";
      mensagem += "Cliente: " + (pedido.cliente || "") + "\n";
      mensagem += "Telefone: " + (pedido.telefone || "") + "\n";
      mensagem += "CEP: " + (pedido.cep || "") + "\n";
      mensagem += "Endereço: " + (pedido.endereco || "") + "\n";
      mensagem += "Número: " + (pedido.numeroCasa || "") + "\n";
      mensagem += "Observação: " + (pedido.observacao || "") + "\n";
      mensagem += "Taxa de Entrega: R$ " + Number(pedido.taxaEntrega || 0).toFixed(2) + "\n\n";
      mensagem += "ITENS:\n[KV-ITENS]\n";

      (pedido.itens || []).forEach((item) => {
        mensagem += item.descricao + " - R$ " + Number(item.valor).toFixed(2) + "\n";
        if (item.adicionais && item.adicionais.length) {
          mensagem += "Adicionais: " + item.adicionais.join(", ") + "\n";
        }
        if (item.observacao) {
          mensagem += "Obs: " + item.observacao + "\n";
        }
        mensagem += "\n";
      });

      mensagem += "\nTOTAL: R$ " + Number(pedido.total || 0).toFixed(2);

      window.open(
        "https://wa.me/" + NUMERO_WHATSAPP + "?text=" + encodeURIComponent(mensagem),
        "_blank"
      );
    }

    function importarPedidoWhats() {
      const texto = document.getElementById("pedidoWhats").value;
      if (!texto.trim()) return;

      limparPedido();

      const nome = texto.match(/Cliente:\s*(.*)/i);
      const telefone = texto.match(/Telefone:\s*(.*)/i);
      const cep = texto.match(/CEP:\s*(.*)/i);
      const numero = texto.match(/N[uú]mero:\s*(.*)/i);
      const endereco = texto.match(/Endere[cç]o:\s*(.*)/i);
      const obs = texto.match(/Observa[cç][aã]o:\s*(.*)/i);

      document.getElementById("nome").value = nome ? nome[1].trim() : "";
      document.getElementById("telefone").value = telefone ? telefone[1].trim() : "";
      document.getElementById("cep").value = cep ? cep[1].trim() : "";
      document.getElementById("numero").value = numero ? numero[1].trim() : "";
      if (endereco && endereco[1].trim()) {
        document.getElementById("endereco").value = endereco[1].trim();
      }
      if (obs && obs[1].trim()) {
        document.getElementById("observacao").value = obs[1].trim();
      }

      const linhas = texto.split("\n");
      linhas.forEach((rawLinha) => {
        const linha = rawLinha.trim();

        if (linha.startsWith("Brotinho 25cm - ")) {
          const sabor = linha
            .split(" - R$ ")[0]
            .replace("Brotinho 25cm - ", "")
            .split(" + ")[0]
            .trim();

          if (SABORES[sabor]) {
            document.getElementById("tamanho").value = "brotinho";
            carregarSabores();
            document.getElementById("sabor1").value = sabor;
            document.getElementById("btnAdicionarPizza").click();
          }
        } else if (linha.startsWith("Grande 35cm Meio a Meio - ")) {
          const descricaoPizza = linha
            .split(" - R$ ")[0]
            .replace("Grande 35cm Meio a Meio - ", "");
          const partes = descricaoPizza.split(" + ")[0].split(" / ");

          if (partes.length === 2 && SABORES[partes[0].trim()] && SABORES[partes[1].trim()]) {
            document.getElementById("tamanho").value = "grande";
            document.getElementById("tipoPizza").value = "meio";
            carregarSabores();
            atualizarVisualPedido();
            document.getElementById("sabor1").value = partes[0].trim();
            document.getElementById("sabor2").value = partes[1].trim();
            document.getElementById("btnAdicionarPizza").click();
          }
        } else if (linha.startsWith("Grande 35cm - ")) {
          const sabor = linha
            .split(" - R$ ")[0]
            .replace("Grande 35cm - ", "")
            .split(" + ")[0]
            .trim();

          if (SABORES[sabor]) {
            document.getElementById("tamanho").value = "grande";
            document.getElementById("tipoPizza").value = "inteira";
            carregarSabores();
            document.getElementById("sabor1").value = sabor;
            document.getElementById("btnAdicionarPizza").click();
          }
        }
      });

      const bebidaSelect = document.getElementById("bebida");
      for (let i = 1; i < bebidaSelect.options.length; i++) {
        const optText = bebidaSelect.options[i].text.split(" - R$ ")[0];
        if (texto.includes(optText)) {
          bebidaSelect.selectedIndex = i;
          document.getElementById("btnAdicionarBebida").click();
        }
      }

      buscarCEP();
      calcularTaxaEntrega();
      alert("Pedido importado!");
    }

    /* GESTÃO DE CLIENTES */
    function salvarClienteBase(dados) {
      if (!dados.nome) {
        alert("Informe o nome do cliente.");
        return;
      }

      if (dados.id) {
        const idx = clientesBase.findIndex((c) => c.id === dados.id);
        if (idx >= 0) {
          clientesBase[idx] = { ...clientesBase[idx], ...dados };
        }
      } else {
        const existente = clientesBase.find(
          (c) => c.nome.toLowerCase() === dados.nome.toLowerCase()
        );
        if (existente) {
          Object.assign(existente, dados, { id: existente.id });
        } else {
          clientesBase.unshift({
            id: "CLI-" + Date.now(),
            ...dados
          });
        }
      }

      salvarClientes();
      renderizarClientes();
    }

      document.getElementById("cep").value = cli.cep || "";

    /* HISTÓRICO & CAIXA */
    function definirStatusHistorico(index, novoStatus) {
      if (!historicoPedidos[index]) return;
      const meta = obterMetaStatus(novoStatus);
      historicoPedidos[index].status = meta.key;
      salvarHistorico();
      renderizarHistorico();
      popularDatalistRuas();
    }

    function alternarStatusPedido(index) {
      if (!historicoPedidos[index]) return;
      const atualNorm = normalizarStatusPedido(historicoPedidos[index].status);
      const idxAtual = ETAPAS_PEDIDO.findIndex((e) => e.key === atualNorm);
      const prox = ETAPAS_PEDIDO[(idxAtual + 1) % ETAPAS_PEDIDO.length];
      definirStatusHistorico(index, prox.key);
    }

    let filtroHistoricoAtual = "Todos";

    function selecionarFiltroHistorico(filtro) {
      filtroHistoricoAtual = filtro || "Todos";
      const barra = document.getElementById("filtrosStatusHistorico");
      if (barra) {
        barra.querySelectorAll("button").forEach((b) => {
          const f = b.dataset.filtroStatus;
          b.className = "status-btn";
          if (f === filtroHistoricoAtual) {
            if (f === "Todos") b.classList.add("active-feito");
            else {
              const meta = obterMetaStatus(f);
              b.classList.add(meta.activeClass);
            }
          }
        });
      }
      renderizarHistorico();
    }

    function renderizarHistorico() {
      const container = document.getElementById("listaHistorico");
      const termo = (document.getElementById("buscaHistorico").value || "").toLowerCase().trim();

      let soma = 0;
      historicoPedidos.forEach((p) => {
        const val = Number(String(p.total || 0).replace(",", "."));
        if (!isNaN(val)) soma += val;
      });

      const qtd = historicoPedidos.length;
      const ticket = qtd > 0 ? soma / qtd : 0;

      document.getElementById("kpiQtdPedidos").innerText = qtd;
      document.getElementById("kpiFaturamento").innerText = soma.toFixed(2);
      document.getElementById("kpiTicketMedio").innerText = ticket.toFixed(2);

      const filtrados = historicoPedidos
        .map((p, idx) => ({ p, idx }))
        .filter(({ p }) => {
          const normStatus = normalizarStatusPedido(p.status);
          if (filtroHistoricoAtual && filtroHistoricoAtual !== "Todos" && normStatus !== filtroHistoricoAtual) {
            return false;
          }
          if (!termo) return true;
          return (
            (p.numero || "").toLowerCase().includes(termo) ||
            (p.cliente || "").toLowerCase().includes(termo) ||
            (p.status || "").toLowerCase().includes(termo) ||
            normStatus.toLowerCase().includes(termo)
          );
        });

      if (!filtrados.length) {
        container.innerHTML = '<p style="color: var(--muted);">Nenhum pedido registrado no histórico.</p>';
        return;
      }

      container.innerHTML = filtrados
        .map(
          ({ p, idx }) => {
            const meta = obterMetaStatus(p.status);
            const botoesEtapas = ETAPAS_PEDIDO.map((etapa) => {
              const ativo = etapa.key === meta.key;
              return `<button class="status-btn ${ativo ? etapa.activeClass : ""}" onclick="definirStatusHistorico(${idx}, '${etapa.key}')" type="button">${etapa.label}</button>`;
            }).join("");

            return `
          <div class="list-card">
            <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
              <div>
                <strong>${p.numero || "KV"}</strong> • <span class="status-pill ${meta.pillClass}">${meta.label}</span><br />
                <span style="font-size: 0.9rem;">Cliente: ${p.cliente || "Não informado"} ${p.telefone ? "• " + p.telefone : ""}</span><br />
                <span style="color: var(--muted); font-size: 0.82rem;">${p.data || ""}</span>
              </div>
              <div style="text-align: right;">
                <strong style="color: var(--gold); font-size: 1.05rem;">R$ ${Number(p.total || 0).toFixed(2)}</strong><br />
                <button class="secondary" style="margin-top: 6px;" onclick="alternarStatusPedido(${idx})" type="button">
                  Próxima Etapa
                </button>
              </div>
            </div>
            <div class="status-stepper" aria-label="Alterar status do pedido ${p.numero || ""}">
              ${botoesEtapas}
            </div>
          </div>
        `;
          }
        )
        .join("");
    }

    /* EXPORTAÇÃO CSV & BACKUP JSON */
    function baixarCSV(nomeArquivo, linhas) {
      const csv = linhas
        .map((linha) =>
          linha.map((campo) => `"${String(campo ?? "").replace(/"/g, '""')}"`).join(";")
        )
        .join("\n");

      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = nomeArquivo;
      a.click();
      URL.revokeObjectURL(url);
    }

      if (!arquivo) return;
      const leitor = new FileReader();
      leitor.onload = function (ev) {
        document.getElementById("inputBackupJson").value = ev.target.result || "";
      };
      leitor.readAsText(arquivo);
    });

    document.getElementById("btnImportarBackup").addEventListener("click", function () {
      const raw = document.getElementById("inputBackupJson").value.trim();
      if (!raw) {
        alert("Cole ou carregue um JSON de backup primeiro.");
        return;
      }

      try {
        const dados = JSON.parse(raw);
        if (dados.sabores && typeof dados.sabores === "object") {
          SABORES = dados.sabores;
          salvarSaboresStorage();
        }
        if (Array.isArray(dados.clientes)) {
          clientesBase = dados.clientes;
          salvarClientes();
        }
        if (Array.isArray(dados.historicoPedidos)) {
          historicoPedidos = dados.historicoPedidos;
          salvarHistorico();
        }
        if (typeof dados.ultimoPedido === "number") {
          localStorage.setItem("ultimoPedido", String(dados.ultimoPedido));
        }

        carregarSabores();
        renderizarListaSabores();
        renderizarClientes();
        renderizarHistorico();
        popularDatalistRuas();
        inicializarPedido();
        atualizarCarrinho();
        alert("Backup restaurado com sucesso!");
      } catch (err) {
        alert("JSON inválido: " + err.message);
      }
    });

    document.getElementById("endereco").addEventListener("blur", buscarCEPPorRua);
    document.getElementById("endereco").addEventListener("change", buscarCEPPorRua);

    /* INICIALIZAÇÃO */
    carregarSaboresStorage();
    carregarHistorico();
    carregarClientes();
    inicializarPedido();
    carregarSabores();
    atualizarCarrinho();
    renderizarListaSabores();
    renderizarClientes();
    renderizarHistorico();
    popularDatalistRuas();
  </script>
</body>
</html>
