<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KING VENTURA PIZZARIA</title>

<link rel="stylesheet"
href="css/style.css">

<script src="js/sabores.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/historico.js"></script>
<script src="js/whatsapp.js"></script>

</head>

<body>

<h1>KING VENTURA PIZZARIA</h1>

<div class="card">

<h2>Cliente</h2>

<input
id="nome"
placeholder="Nome">

<input
id="telefone"
placeholder="Telefone">

<input
id="endereco"
placeholder="Endereço">

<textarea
id="observacao"
placeholder="Observação">
</textarea>

</div>

<div class="card">

<h2>Pedido</h2>

<select id="tamanho">

<option value="brotinho">
Brotinho 25cm
</option>

<option value="grande">
Grande 35cm
</option>

</select>

<select id="tipoPizza">

<option value="inteira">
Inteira
</option>

<option value="meio">
Meio a Meio
</option>

</select>

<select id="sabor1"></select>

<select
id="sabor2"
style="display:none">
</select>

<div id="ingredientes">
</div>

<button
id="btnAdicionarPizza">

Adicionar Pizza

</button>

</div>

<div class="card">

<h2>Bebidas</h2>

<select id="bebida">

<option value="16">
Coca-Cola 2 Litros - R$ 16,00
</option>

<option value="10">
Guaraná Antarctica 1 Litro - R$ 10,00
</option>

<option value="6">
Coca-Cola Lata 310ml - R$ 6,00
</option>

</select>

<button
id="btnAdicionarBebida">

Adicionar Bebida

</button>

</div>

<div class="card">

<h2>Carrinho</h2>

<div id="carrinho">
</div>

<h3>

Total:

R$ <span id="totalPedido">0,00</span>

</h3>

<button
id="btnWhatsApp">

Enviar WhatsApp

</button>

<button
onclick="window.print()">

Imprimir Pedido

</button>

</div>
<script>

function carregarSabores(){

    const tamanho =
        document.getElementById(
            "tamanho"
        ).value;

    const sabor1 =
        document.getElementById(
            "sabor1"
        );

    const sabor2 =
        document.getElementById(
            "sabor2"
        );

    sabor1.innerHTML = "";
    sabor2.innerHTML = "";

    Object.keys(
        SABORES
    ).forEach(nome => {

        const preco =
            tamanho === "brotinho"
            ? SABORES[nome].brotinho
            : SABORES[nome].grande;

        sabor1.innerHTML +=
            `<option value="${nome}">
            ${nome} - R$ ${preco.toFixed(2)}
            </option>`;

        sabor2.innerHTML +=
            `<option value="${nome}">
            ${nome} - R$ ${preco.toFixed(2)}
            </option>`;
    });

    atualizarVisualPedido();
}

function atualizarVisualPedido(){

    const tamanho =
        document.getElementById(
            "tamanho"
        ).value;

    const tipo =
        document.getElementById(
            "tipoPizza"
        ).value;

    const sabor2 =
        document.getElementById(
            "sabor2"
        );

    if(tamanho === "brotinho"){

        document
        .getElementById(
            "tipoPizza"
        )
        .disabled = true;

        document
        .getElementById(
            "tipoPizza"
        )
        .value = "inteira";

        sabor2.style.display =
            "none";

    }else{

        document
        .getElementById(
            "tipoPizza"
        )
        .disabled = false;

        sabor2.style.display =
            tipo === "meio"
            ? "block"
            : "none";
    }
}

document
.getElementById(
    "btnAdicionarPizza"
)
.addEventListener(
    "click",
    function(){

        const tamanho =
            document
            .getElementById(
                "tamanho"
            )
            .value;

        const tipo =
            document
            .getElementById(
                "tipoPizza"
            )
            .value;

        const sabor1 =
            document
            .getElementById(
                "sabor1"
            )
            .value;

        const sabor2 =
            document
            .getElementById(
                "sabor2"
            )
            .value;

        let descricao = "";
        let valor = 0;
        let ingredientes = "";

        if(
            tamanho === "brotinho"
        ){

            descricao =
                "Brotinho 25cm - "
                + sabor1;

            valor =
                SABORES[sabor1]
                .brotinho;

            ingredientes =
                SABORES[sabor1]
                .ingredientes
                .join(", ");

        }else{

            if(tipo === "meio"){

                descricao =
                    "Grande 35cm Meio a Meio - "
                    + sabor1
                    + " / "
                    + sabor2;

                valor =
                    Math.max(
                        SABORES[
                            sabor1
                        ].grande,

                        SABORES[
                            sabor2
                        ].grande
                    );

                ingredientes =
                    "50% "
                    + sabor1
                    + ": "
                    + SABORES[
                        sabor1
                    ].ingredientes.join(", ")

                    +

                    " | 50% "

                    + sabor2

                    + ": "

                    + SABORES[
                        sabor2
                    ].ingredientes.join(", ");

            }else{

                descricao =
                    "Grande 35cm - "
                    + sabor1;

                valor =
                    SABORES[
                        sabor1
                    ].grande;

                ingredientes =
                    SABORES[
                        sabor1
                    ].ingredientes.join(", ");
            }
        }

        adicionarItem({
            descricao,
            valor,
            ingredientes
        });
    }
);

document
.getElementById(
    "btnAdicionarBebida"
)
.addEventListener(
    "click",
    function(){

        const bebida =
            document
            .getElementById(
                "bebida"
            );

        adicionarItem({

            descricao:
                bebida.options[
                    bebida.selectedIndex
                ].text,

            valor:
                Number(
                    bebida.value
                ),

            ingredientes: ""

        });
    }
);

document
.getElementById(
    "btnWhatsApp"
)
.addEventListener(
    "click",
    function(){

        pedidoAtual.cliente =
            document
            .getElementById(
                "nome"
            )
            .value;

        pedidoAtual.telefone =
            document
            .getElementById(
                "telefone"
            )
            .value;

        pedidoAtual.endereco =
            document
            .getElementById(
                "endereco"
            )
            .value;

        enviarWhatsApp(
            pedidoAtual
        );
    }
);

document
.getElementById(
    "tamanho"
)
.addEventListener(
    "change",
    carregarSabores
);

document
.getElementById(
    "tipoPizza"
)
.addEventListener(
    "change",
    atualizarVisualPedido
);

carregarSabores();

</script>
</body>

</html>
