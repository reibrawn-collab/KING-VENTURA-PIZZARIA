<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KING VENTURA PIZZARIA — Sistema Operacional</title>
  <style>
    :root {
      --bg: #120d0a;
      --surface: #1d1510;
      --surface-2: #271c16;
      --border: #3d2c22;
      --text: #f7efe8;
      --muted: #c2aea0;
      --gold: #e09f3e;
      --terracotta: #c84b31;
      --green: #2ea043;
      --amber: #d29922;
      --danger: #cf4638;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.45;
    }

    .app-container {
      max-width: 960px;
      margin: 0 auto;
    }

    .brand-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .brand-logo {
      display: block;
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .brand-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--gold);
    }

    .badge-version {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .nav-tab {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.15s ease;
    }

    .nav-tab:hover {
      border-color: var(--gold);
      color: var(--text);
    }

    .nav-tab.active {
      background: var(--gold);
      color: #160f0a;
      border-color: var(--gold);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: var(--gold);
    }

    .card h3 {
      font-size: 1rem;
      margin: 12px 0 8px;
      color: var(--text);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
      margin-top: 8px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    button {
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.gold {
      background: var(--gold);
      color: #160f0a;
    }

    button.danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .item, .list-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .summary-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gold);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 6px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .kpi-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .kpi-label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .kpi-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold);
      margin-top: 4px;
    }

    .status-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(210, 153, 34, 0.18);
      color: var(--amber);
    }

    .ingredients-preview {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 6px;
    }

    #cupomTermico {
      display: none;
    }

    @media print {
      @page {
        margin: 2mm;
      }
      body * {
        visibility: hidden !important;
      }
      #cupomTermico, #cupomTermico * {
        visibility: visible !important;
        font-weight: 900 !important;
        color: #000 !important;
        background: #fff !important;
      }
      #cupomTermico {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 58mm;
        font-family: monospace, sans-serif;
        font-size: 11px;
        line-height: 1.25;
        padding: 0;
        margin: 0;
      }
      .cupom-linha {
        border-top: 1px dashed #000;
        margin: 4px 0;
      }
      .cupom-item {
        margin-bottom: 4px;
      }
    }
  </style>
</head>

        <span class="badge-version">V7.2 REBUILD</span>
